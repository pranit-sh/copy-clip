name: copy_clip
description: "Copy Clip — a fast, keyboard-first clipboard manager for Chrome."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
