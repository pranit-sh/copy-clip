<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Copy Clip — fast clipboard manager for Chrome.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Copy Clip">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png"/>

  <title>Copy Clip</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #F7F8FA;
      overflow: hidden;
    }
    /* Only lock to popup dimensions when running as the Chrome extension
       popup (bootstrap script adds .is-popup). In `flutter run -d chrome`
       the app fills the whole window instead. */
    html.is-popup, html.is-popup body {
      width: 360px;
      height: 520px;
    }
    #splash {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #6B7280; font: 500 12px system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <div id="splash">Loading…</div>
  <script src="popup_bootstrap.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
